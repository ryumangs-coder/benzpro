name: Update relevant vehicle videos
on:
  schedule:
    - cron: '17 21 * * *'
  push:
    paths:
      - '.github/workflows/video-catalogue.yml'
      - 'scripts/sync-videos.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vehicle-video-catalogue
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync-videos.py
      - name: Publish only catalogue changes
        run: |
          if ! git diff --quiet -- benz-videos.json; then
            git config user.name 'benzpro-video-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add benz-videos.json
            git commit -m 'Refresh relevant vehicle video catalogue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
